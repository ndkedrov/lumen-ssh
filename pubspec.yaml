name: lumen_ssh
description: "Нативний SSH-клієнт (Flutter): термінал, SFTP, монітор навантаження."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.16
  xterm: ^4.0.0
  dartssh2: ^2.12.0
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  encrypt: ^5.0.3
  crypto: ^3.0.6
  desktop_drop: ^0.5.0
  cross_file: ^0.3.4
  window_manager: ^0.4.3

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
